<h1 class="visually-hidden">Photos</h1>

<app-photo-grid>
  <!-- The stream is append-only and may repeat a photo after wrapping around the catalog,
       so position is the stable identity here. -->
  @for (photo of stream.photos(); track $index) {
    <button
      type="button"
      class="photo-tile"
      [attr.aria-label]="
        (favorites.has(photo.id) ? 'In favorites: photo by ' : 'Add to favorites: photo by ') +
        photo.author
      "
      (click)="addToFavorites(photo)"
    >
      <app-photo-card [photo]="photo" [favorite]="favorites.has(photo.id)" />
    </button>
  }
</app-photo-grid>

@if (stream.loading()) {
  <app-loader />
}

@if (stream.error(); as error) {
  <div class="photos-page__error" role="alert">
    <mat-icon>cloud_off</mat-icon>
    <p>{{ error }}</p>
    <button matButton="outlined" type="button" (click)="stream.loadMore()">Try again</button>
  </div>
}

<div
  class="photos-page__sentinel"
  appInfiniteScroll
  [infiniteScrollDisabled]="stream.loading() || !!stream.error()"
  (scrolled)="stream.loadMore()"
></div>
